# secret-access-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: vm-security-lab
  name: secret-reader
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["database-credentials", "vm-encryption-key"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-secret-access
  namespace: vm-security-lab
subjects:
- kind: ServiceAccount
  name: vm-operator-sa
  namespace: vm-security-lab
- kind: ServiceAccount
  name: vm-admin-sa
  namespace: vm-security-lab
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io
