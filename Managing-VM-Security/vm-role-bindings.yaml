# vm-role-bindings.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-viewer-binding
  namespace: vm-security-lab
subjects:
- kind: ServiceAccount
  name: vm-viewer-sa
  namespace: vm-security-lab
roleRef:
  kind: Role
  name: vm-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-operator-binding
  namespace: vm-security-lab
subjects:
- kind: ServiceAccount
  name: vm-operator-sa
  namespace: vm-security-lab
roleRef:
  kind: Role
  name: vm-operator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vm-admin-binding
  namespace: vm-security-lab
subjects:
- kind: ServiceAccount
  name: vm-admin-sa
  namespace: vm-security-lab
roleRef:
  kind: Role
  name: vm-admin
  apiGroup: rbac.authorization.k8s.io
