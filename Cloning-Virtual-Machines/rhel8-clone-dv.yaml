apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: rhel8-clone-cli-rootdisk
  namespace: default
spec:
  source:
    pvc:
      name: rhel8-base-rootdisk
      namespace: default
  pvc:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
    storageClassName: local-path
