# Create file: ha-vm-anti-affinity.yaml
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ha-vm-web-1
  namespace: default
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/vm: ha-vm-web-1
        app: web-server
        tier: frontend
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - web-server
            topologyKey: kubernetes.io/hostname
      domain:
        devices:
          disks:
          - name: containerdisk
            disk:
              bus: virtio
        machine:
          type: ""
        resources:
          requests:
            memory: 512Mi
            cpu: 500m
      volumes:
      - name: containerdisk
        containerDisk:
          image: quay.io/kubevirt/cirros-container-disk-demo
