apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-with-persistent-storage
  namespace: default
  labels:
    app: storage-demo
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/vm: vm-with-persistent-storage
    spec:
      domain:
        cpu:
          cores: 2
        memory:
          guest: 2Gi
        devices:
          disks:
          - name: rootdisk
            disk:
              bus: virtio
          - name: datadisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          interfaces:
          - name: default
            masquerade: {}
        resources:
          requests:
            memory: 2Gi
            cpu: 500m
      networks:
      - name: default
        pod: {}
      volumes:
      - name: rootdisk
        persistentVolumeClaim:
          claimName: vm-disk-pvc
      - name: datadisk
        persistentVolumeClaim:
          claimName: vm-data-pvc
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |
            #cloud-config
            user: fedora
            password: fedora
            chpasswd: { expire: False }
            ssh_authorized_keys:
              - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC... # Add your SSH key here
